<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#552785" />
    <meta
      name="description"
      content="دليل الأطباء والمستشفيات والخدمات الطبية لأعضاء النقابة بالمصرية للاتصالات في الدقهلية."
    />
    <title>دليل WE الطبي | الدقهلية</title>
    <link rel="icon" href="img/favicon-32.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="img/icon-192.png" />
    <link rel="stylesheet" href="css/styles.css?v=20261018-quality" />
    <link rel="stylesheet" href="css/fonts.css" />
    <script defer src="js/config.js?v=20261017-live"></script>
    <script defer src="js/storage.js"></script>
    <script defer src="js/api.js?v=20261018-companion"></script>
    <script defer src="js/quality.js?v=20261018-quality"></script>
    <script defer src="js/app.js?v=20261018-quality"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
    <header class="app-header">
      <a class="brand" href="#home" aria-label="دليل WE الطبي، الرئيسية">
        <img src="img/we_logo.webp" alt="WE" width="44" height="44" />
        <span
          ><strong>دليل WE الطبي</strong
          ><small>اللجنة النقابية · الدقهلية</small></span
        >
      </a>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-button" aria-label="تبديل المظهر">
          ◐
        </button>
        <button id="member-button" class="button primary">دخول الأعضاء</button>
        <a href="#admin" class="admin-link">الإدارة</a>
      </div>
    </header>
    <div class="page-shell">
      <div id="connection-status" class="connection-status" role="status"></div>
      <button id="update-button" class="button outline" hidden>
        تحديث التطبيق
      </button>
      <section class="search-panel" aria-label="البحث في الدليل" hidden>
        <label for="search-input" class="sr-only"
          >ابحث بالاسم أو التخصص أو العنوان</label
        >
        <div class="search-field">
          <span aria-hidden="true">⌕</span
          ><input
            id="search-input"
            type="search"
            placeholder="ابحث باسم الطبيب أو التخصص أو الجهة…"
            autocomplete="off"
          /><button
            id="clear-search"
            class="text-button"
            aria-label="مسح البحث"
          >
            مسح
          </button>
        </div>
        <div id="filters" class="filters"></div>
      </section>
      <main id="main" tabindex="-1"></main>
      <footer class="app-footer">
        <img
          src="img/nekaba_logo.png"
          alt="اللجنة النقابية"
          width="38"
          height="38"
        />
        <p>
          دليل الرعاية الطبية للعاملين بالمصرية للاتصالات وأسرهم بالدقهلية<br /><strong
            >إعداد وتنفيذ: الأستاذ / محمود العراقي</strong
          >
        </p>
        <small>تأكد من المواعيد والتعاقد والتغطية مع الجهة قبل الزيارة.</small>
      </footer>
    </div>
    <nav id="main-nav" class="bottom-nav" aria-label="التنقل الرئيسي" hidden></nav>
    <dialog id="app-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button
          id="dialog-close"
          class="icon-button"
          aria-label="إغلاق النافذة"
        >
          ×
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      >يتطلب البحث في الدليل تفعيل JavaScript. للحالات الطارئة اتصل بالإسعاف
      123.</noscript
    >
  </body>
</html>
