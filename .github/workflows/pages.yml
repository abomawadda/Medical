name: Validate Medical
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: medical-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix functions
      - run: npm test
      - run: npm ci --ignore-scripts
      - run: node scripts/prepare-seed.mjs
      - run: npm run build
      - run: npm run check
      - run: npm run audit:catalog
      - name: Install browser for validation
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Validate browser journeys
        timeout-minutes: 6
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: medical-static
          path: dist
